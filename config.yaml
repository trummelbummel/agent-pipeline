# Compliance project configuration
# Externalize all tunable values here — model names, thresholds, URLs, retry params.

# HTTP API intake caps (D-01): 25 MiB per file, 50 MiB total request (binary megabytes).
api:
  upload:
    max_file_bytes: 26214400
    max_request_bytes: 52428800

preprocessing:
  data_dir: data/raw
  # Mirrored claim artifacts (description, answer, supporting docs)
  preprocessed_dir: data/preprocessed
  # Pipeline decisions (predicted_answer.json), separate from preprocessed inputs
  results_dir: data/results
  document_formats:
    - webp
    - jpg
    - jpeg
    - png
    - pdf
  confidence_threshold: 0.7
  # FormatConverter converts document_formats → PNG before Docling (png passthrough)
  artifacts:
    description: description.txt
    answer: answer.json
    predicted_answer: predicted_answer.json
    analysis_result: analysis_result.json
    run_manifest: run_manifest.json
    supporting_document: supporting_document.md
    supporting_documents: supporting_documents.md
    document_metadata: document_metadata.json

extraction:
  model: qwen2.5:7b
  prompt: |
    Extract booking/travel fields matching the provided schema from the claim description.
    Return only fields present in the text; omit unknowns.

classification:
  # Numeric coverage labels; semantic names in label_names (prompts keep the mapping too).
  # "False" = abstain when no positive class fits (shared with analysis stages).
  labels:
    - "1"
    - "2"
    - "3"
    - "False"
  label_names:
    "1": Trip cancellation or rescheduling
    "2": Personal Effects
    "3": Missed Departure or Missed Connection
  other_label: "False"
  model: qwen2.5:7b
  prompt: |
    Classify the claim description into one or more of the allowed coverage labels.
    Labels are numeric codes. Use this mapping:

    1 = Trip cancellation or rescheduling — If a trip, booking, or prepaid
    organized activity is cancelled, rescheduled, or unused for a covered reason
    (including sports camps / stages, courses, training stays, and similar prepaid
    activities missed because of illness or medical inability to participate),
    you may be eligible for compensation.
    2 = Personal Effects — If your personal belongings are lost or damaged during
    your trip, you may be eligible for compensation.
    3 = Missed Departure or Missed Connection — If you miss a scheduled departure
    or connection due to a covered reason (e.g., traffic accident en route).

    Return JSON with keys "labels" (array of selected label codes as strings) and
    "probabilities" (object mapping each allowed label code to a float in [0, 1]).
    Use {other_label} only when no coverage class fits. Do not return description text
    as a label — only the numeric codes (or {other_label}).

checking:
  model: qwen2.5:7b
  containment_prompt: |
    Decide whether the claim is present in or entailed by the reference text.
    Return JSON only: {"result": true} if the claim is contained/entailed,
    {"result": false} otherwise.
  contradicts_prompt: |
    Decide whether the claim contradicts the reference text.
    Return JSON only: {"result": true} if the claim contradicts the text,
    {"result": false} if the claim is supported by or consistent with the text.
  # Extract a single person name; identity match uses lowercased Levenshtein
  # against the booking name (see identity_max_edit_distance).
  identity_prompt: |
    Extract the single person name that identifies the passenger, claimant,
    patient, subject, or insured in the given text.

    Prefer an explicit name / patient / passenger field. Ignore doctor,
    physician, surgeon, nurse, facility, hospital, clinic, laboratory, stamp,
    letterhead, signature-block, and requester / applicant / "solicitud del"
    names — those are not the person to extract.

    Return JSON only:
    {"name": "<full name as written>"} when a clear person name is present
    {"name": null} when there is no clear patient/claimant name field
    (do not invent a name from doctor or facility text)
  # Inclusive Levenshtein distance on lowercased names (and token-wise):
  # distance ≤ this value → identity match (OCR spelling noise OK).
  identity_max_edit_distance: 3
  healthy_prompt: |
    Decide whether the supporting document states that the patient is healthy,
    clinically well, fit, able to travel or perform activity, or otherwise not ill
    (e.g. "clínicamente sana", "apte", "in good health", "apto para actividad física").
    Return JSON only: {"result": true} if the document asserts health / fitness
    (no illness supporting a medical cancellation claim),
    {"result": false} if the document describes illness, injury, hospitalization,
    incapacity, or does not assert that the patient is healthy.
  incomplete_prompt: |
    Decide whether a medical supporting document is incomplete — missing required
    clinical fields such as diagnosis, condition/illness description, or discharge /
    issue date needed to support a medical cancellation claim. Do not treat a
    missing signature alone as incomplete (signature is checked separately).
    Return JSON only: {"result": true} if required clinical fields are missing
    (violation), {"result": false} if diagnosis/condition and dating fields are
    adequately present.
  # Medical path: upcoming departure farther than n days → UNCERTAIN (recovery unclear).
  # Past flights and departures within n days → continue through remaining checkers
  # (healthy / identity DENY still apply). Gate ranks before identity DENY.
  departure_uncertain_enabled: true
  departure_uncertain_within_days: 14
  # Inclusive month skew: |OCR date − reference today| in months ≥ n → UNCERTAIN.
  suspicious_dating_max_month_delta: 1
  # Only OCR dates within ±n years of reference today are considered for
  # suspicious dating; farther dates are treated as history. Birth/DOB cues
  # drop a date even inside this window.
  suspicious_dating_consider_within_years: 5
  # Lexical cue vocabularies for the dating gate (accent-insensitive match).
  # Keep lists small; if they sprawl across languages, prefer LLM date-role
  # extraction as a non-deterministic fallback (see README).
  issue_date_cues:
    - "issue date"
    - "date of issue"
    - "issued on"
    - "issued"
    - "stamped"
    - "émission"
    - "emision"
    - "emisión"
    - "fecha de emisión"
    - "fecha de emision"
    - "fait à"
    - "fait a"
  care_window_cues:
    - "care"
    - "admission"
    - "visit"
    - "discharge"
    - "consulta"
    - "hospitalisation"
    - "hospitalization"
    - "hospitalized"
    - "hospitalize"
    - "pris en charge"
    - "tratamiento"
    - "treatment"
    - "attending"
    - "ricovero"
    - "ricoverata"
    - "ricoverato"
    - "ricoverati"
    - "dimesso"
    - "dimessa"
    - "dimessi"
    - "ingreso"
    - "alta"
  dob_cues:
    - "nata"
    - "nato"
    - "nati"
    - "born"
    - "birth"
    - "dob"
    - "d.o.b"
    - "nacimiento"
    - "geboren"
    - "geburt"
    # Phrase form — bare "né"/"née" normalize to "ne" and hit French negation.
    - "né le"
    - "née le"
    - "ne le"
    - "nascida"
    - "nascido"
  # Checker chat transport failures (connection / timeout / server error) are
  # retried with delay backoff_seconds * 2**attempt; after exhaustion the check
  # is recorded as ERROR → UNCERTAIN + human_in_the_loop (SR-008).
  transport_retry:
    max_retries: 2
    backoff_seconds: 1.0

analysis:
  coverage:
    # Numeric coverage labels; descriptions live in the prompt mapping below.
    # "False" = abstain (replaces the old "None" token — see README Tests/Algorithm notes).
    labels:
      - "1"
      - "2"
      - "3"
      - "False"
    # Authoritative label-code → routing-branch map; label order carries no routing meaning (D-01).
    branches:
      "1": cancellation
      "2": personal_effects
      "3": missed_departure
    label_names:
      "1": Trip cancellation or rescheduling
      "2": Personal Effects
      "3": Missed Departure or Missed Connection
    other_label: "False"
    model: qwen2.5:7b
    prompt: |
      Classify the claim description into one or more of the allowed coverage labels.
      Labels are numeric codes. Use this mapping:

      1 = Trip cancellation or rescheduling — If a trip, booking, or prepaid
      organized activity is cancelled, rescheduled, or unused for a covered reason
      (including sports camps / stages, courses, training stays, and similar prepaid
      activities missed because of illness or medical inability to participate),
      you may be eligible for compensation.
      2 = Personal Effects — If your personal belongings are lost or damaged during
      your trip, you may be eligible for compensation.
      3 = Missed Departure or Missed Connection — If you miss a scheduled departure
      or connection due to a covered reason (e.g., traffic accident en route).

      Return JSON with keys "labels" (array of selected label codes as strings) and
      "probabilities" (object mapping each allowed label code to a float in [0, 1]).
      Use {other_label} only when no coverage class fits. Do not return description text
      as a label — only the numeric codes (or {other_label}).
  cancellation_reason:
    # Numeric reason labels; descriptions live in the prompt mapping below.
    labels:
      - "1"
      - "2"
      - "3"
      - "4"
      - "False"
    label_names:
      "1": Jury duty
      "2": Medical emergency
      "3": Theft or criminal incident
      "4": Other specified personal emergencies
    other_label: "False"
    model: qwen2.5:7b
    prompt: |
      Classify the cancellation reason from the claim description into the allowed labels.
      Labels are numeric codes. Use this mapping:

      1 = Jury duty
      2 = Medical emergency — must be supported by a medical report
      3 = Theft or criminal incident — must be supported by a police report
      4 = Other specified personal emergencies

      Return JSON with keys "labels" (array of selected label codes as strings) and
      "probabilities" (object mapping each allowed label code to a float in [0, 1]).
      Use {other_label} only when no reason class fits. Do not return description text
      as a label — only the numeric codes (or {other_label}).
  cancellation_document:
    # Numeric document-type labels; descriptions live in the prompt mapping below.
    labels:
      - "1"
      - "2"
      - "3"
      - "4"
      - "False"
    label_names:
      "1": medical certificate
      "2": police report
      "3": jury summon letter
      "4": hospital admission
    other_label: "False"
    model: qwen2.5:7b
    prompt: |
      Classify the supporting document type from the document text into the allowed labels.
      Labels are numeric codes. Use this mapping:

      1 = medical certificate
      2 = police report
      3 = jury summon letter
      4 = hospital admission

      Return JSON with keys "labels" (array of selected label codes as strings) and
      "probabilities" (object mapping each allowed label code to a float in [0, 1]).
      Use {other_label} only when no document class fits. Do not return description text
      as a label — only the numeric codes (or {other_label}).
  personal_effects_document:
    # Numeric document-type labels; descriptions live in the prompt mapping below.
    labels:
      - "1"
      - "False"
    label_names:
      "1": Proof of theft, loss, or damage
    other_label: "False"
    model: qwen2.5:7b
    prompt: |
      Classify the personal-effects supporting document from the document text.
      Labels are numeric codes. Use this mapping:

      1 = Proof of theft, loss, or damage — such as a police report or acknowledgement
      from the airline

      Return JSON with keys "labels" (array of selected label codes as strings) and
      "probabilities" (object mapping each allowed label code to a float in [0, 1]).
      Use {other_label} only when no document class fits. Do not return description text
      as a label — only the numeric codes (or {other_label}).
  missed_departure_document:
    # Numeric document-type labels; descriptions live in the prompt mapping below.
    labels:
      - "1"
      - "2"
      - "3"
      - "False"
    label_names:
      "1": Incident report or documentation explaining the cause of delay
      "2": Proof of booking
      "3": Medical certificate or hospital documentation explaining the miss
    other_label: "False"
    model: qwen2.5:7b
    prompt: |
      Classify the missed-departure supporting document from the document text.
      Labels are numeric codes. Use this mapping:

      1 = Incident report or documentation explaining the cause of delay — non-medical
      cause evidence such as a traffic/accident report or delay notice (not a medical
      certificate)
      2 = Proof of booking — boarding pass, ticket, or booking confirmation
      3 = Medical certificate or hospital documentation explaining the miss — any
      medical/hospital form, fitness-to-fly note, or clinical certificate used as the
      reason for missing the departure (including certificates that declare the patient
      healthy)

      Prefer 3 over 1 whenever the document is a medical or hospital form, even if it
      also explains a delay.

      Return JSON with keys "labels" (array of selected label codes as strings) and
      "probabilities" (object mapping each allowed label code to a float in [0, 1]).
      Use {other_label} only when no document class fits. Do not return description text
      as a label — only the numeric codes (or {other_label}).
  # Acceptable supporting-document codes for missing-documentation checks.
  # Keys/codes match coverage, cancellation_reason, and document stage labels above.
  # Missed-departure: description phrases that require a medical supporting doc.
  # Same maintenance tradeoff as checking.*_cues — see README.
  medical_mention_cues:
    - "medical"
    - "hospital"
    - "hospitalisation"
    - "hospitalization"
    - "doctor"
    - "physician"
    - "clinic"
    - "illness"
    - "diagnosis"
    - "diagnosed"
    - "sick"
    - "surgery"
    - "surgical"
    - "médical"
    - "medicale"
    - "hôpital"
    - "hopital"
    - "médecin"
    - "clinique"
    - "médico"
    - "medico"
    - "hospitalización"
    - "hospitalizacion"
    - "enfermedad"
    - "medizin"
    - "arzt"
    - "krankenhaus"
    - "erkrankung"
  required_documents:
    # Cancellation reason code → acceptable cancellation_document codes
    cancellation_by_reason:
      "1": ["3"]       # Jury duty → jury summon letter
      "2": ["1", "4"]  # Medical emergency → medical certificate or hospital admission
      "3": ["2"]       # Theft / criminal → police report
      "4": ["1", "2", "3", "4"]  # Other personal emergencies → any cancellation doc type
    personal_effects:
      - "1"            # Proof of theft, loss, or damage
    missed_departure:
      - "1"            # Incident / delay documentation
      - "2"            # Proof of booking
      - "3"            # Medical / hospital documentation
    # On missed-departure: only these document codes open medical gated checks.
    # When the claim description mentions medical, only these codes are acceptable
    # (booking/incident alone → checker_missing_documentation DENY; claim-2 shape).
    missed_departure_medical_codes:
      - "3"
    # Medical certificate + hospital admission must show has_signature in metadata
    signature_required_codes:
      - "1"
      - "4"
    # Same medical / hospital codes: run identity only when one of these is classified
    identity_required_codes:
      - "1"
      - "4"

benford:
  # Off for this take-home dataset: all claim images are synthetic/fake, so DCT
  # Benford checks fire as "fraud" on nearly every file (too sensitive). Keep the
  # checker available for real scanned documents by setting enabled: true.
  enabled: false
  block_size: 8
  chi_squared_threshold: 15.51

extraction_failure:
  min_substantive_chars: 40
  min_words: 5

logging:
  level: INFO
  format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"

ocr_retry:
  # Vision retry after weak Docling OCR. Triggers (any enabled match → one retry):
  # faulty ExtractionFailure, low extraction_probability, or human_in_the_loop.
  # Analysis may retry once more when identity returns unclear and preprocess
  # did not already retry (on_identity_unclear).
  # Signature fallback: Ultralytics YOLO (not Ollama) when Docling misses ink.
  enabled: true
  on_faulty_extraction: true
  on_low_confidence: true
  on_human_in_the_loop: true
  on_identity_unclear: true
  on_missing_signature: true
  signature_model: tech4humans/yolov8s-signature-detector
  signature_weights: yolov8s.pt
  model: Maternion/LightOnOCR-2:1b
  prompt: |
    Transcribe all readable text from this document image into clean markdown
    or plain text. Preserve key-value lines and headings. Do not add commentary,
    translation notes, or explanations — return only the document text.

evaluation:
  labels:
    - APPROVE
    - DENY
    - UNCERTAIN
  unscored_label: NO_PREDICTION
  metrics_artifact: evaluation_metrics.json
  confusion_matrix_artifact: confusion_matrix.json
  visualization_artifact: evaluation_visualization.png
  analysis_stats_artifact: analysis_stats.json
  analysis_visualization_artifact: analysis_stats_visualization.png
